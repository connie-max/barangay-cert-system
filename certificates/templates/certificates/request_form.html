<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Request Certificate - Barangay Certificate System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Poppins', sans-serif;
                background: linear-gradient(135deg, #1e3c72, #2a5298);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .card {
                background: #ffffff;
                padding: 40px 38px;
                border-radius: 18px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
                width: 100%;
                max-width: 420px;
            }

            .icon-header {
                width: 52px;
                height: 52px;
                border-radius: 14px;
                background: linear-gradient(135deg, #2a5298, #1e3c72);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 22px;
                margin-bottom: 18px;
            }

            .card h1 {
                font-size: 19px;
                font-weight: 700;
                color: #1a1a2e;
                margin-bottom: 26px;
            }

            form p {
                margin-bottom: 18px;
            }

            form label {
                display: block;
                font-size: 15px;
                color: #000000;
                margin-bottom: 6px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }

            form select,
            form input {
                width: 100%;
                padding: 12px 14px;
                border: 1.5px solid #e5e5e5;
                border-radius: 10px;
                font-size: 17px;
                font-family: 'Poppins', sans-serif;
                background: white;
                transition: border-color 0.2s;
            }

            form select:focus,
            form input:focus {
                outline: none;
                border-color: #2a5298;
            }

            button {
                width: 100%;
                padding: 13px;
                background: linear-gradient(135deg, #2a5298, #1e3c72);
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 18px;
                font-weight: 600;
                font-family: 'Poppins', sans-serif;
                cursor: pointer;
                margin-top: 8px;
                transition: opacity 0.2s;
            }

            button:hover {
                opacity: 0.9;
            }

            .links {
                margin-top: 22px;
                text-align: center;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .links a {
                color: #2a5298;
                text-decoration: none;
                font-size: 16px;
                font-weight: 500;
            }

            .links a:hover {
                text-decoration: underline;
            }
            /* Example text inside empty boxes is black too, so it is easy to read. */
            input::placeholder, textarea::placeholder {
                color: #000;
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="icon-header"><i class="fa-solid fa-file-circle-plus"></i></div>
            <h1>Request a Certificate</h1>

            <form method="post">
                {% csrf_token %} {{ form.as_p }}
                <button type="submit">Submit Request</button>
            </form>

            <script>
                // Same idea as home.html: the form holds the extra fields, but
                // they only show when their certificate type is picked.
                // Financing company shows for a Loan, personal details for a Cedula.
                (function () {
                    var CEDULA_FIELDS = ["occupation", "civil_status", "date_of_birth", "place_of_birth", "citizenship", "tin", "annual_income"];
                    var select = document.querySelector('select[name="certificate_type"]');
                    if (!select) return;
                    function row(name) {
                        var input = document.querySelector('[name="' + name + '"]');
                        return input ? input.closest('p') : null;
                    }
                    function toggle() {
                        var picked = select.options[select.selectedIndex]
                            ? select.options[select.selectedIndex].text.trim()
                            : '';
                        var loanRow = row('financing_company');
                        if (loanRow) {
                            loanRow.style.display = picked === "Certificate of Loan" ? "" : "none";
                            if (picked !== "Certificate of Loan") loanRow.querySelector('input').value = "";
                        }
                        CEDULA_FIELDS.forEach(function (name) {
                            var r = row(name);
                            if (!r) return;
                            r.style.display = picked === "Cedula" ? "" : "none";
                            if (picked !== "Cedula") {
                                var input = r.querySelector('input, select');
                                if (input) input.value = "";
                            }
                        });
                    }
                    // The Cedula fee follows the annual income (P5 + P1 for
                    // every P1,000), so show it live while they type it in.
                    function updateFee() {
                        var feeLine = document.getElementById('feeLine');
                        if (!feeLine) {
                            feeLine = document.createElement('div');
                            feeLine.id = 'feeLine';
                            feeLine.style.cssText = 'font-weight: 700; color: #000; margin: 12px 0;';
                            var submitBtn = document.querySelector('form button[type="submit"]');
                            if (submitBtn) submitBtn.parentNode.insertBefore(feeLine, submitBtn);
                        }
                        var picked = select.options[select.selectedIndex]
                            ? select.options[select.selectedIndex].text.trim()
                            : '';
                        if (picked === "Cedula") {
                            var incomeInput = document.querySelector('[name="annual_income"]');
                            var income = incomeInput ? parseFloat(incomeInput.value) || 0 : 0;
                            var fee = 5 + Math.floor(income / 1000);
                            feeLine.textContent = 'Cedula fee: ₱' + fee + '.00 (P5 + P1 for every P1,000 of annual income)';
                            feeLine.style.display = '';
                        } else if (picked) {
                            feeLine.textContent = 'Fee: ₱50.00';
                            feeLine.style.display = '';
                        } else {
                            feeLine.style.display = 'none';
                        }
                    }
                    var incomeInput = document.querySelector('[name="annual_income"]');
                    if (incomeInput) incomeInput.addEventListener('input', updateFee);
                    select.addEventListener('change', function () { toggle(); updateFee(); });
                    toggle();
                    updateFee();
                })();
            </script>

            <div class="links">
                <a href="{% url 'my_requests' %}"
                    ><i class="fa-solid fa-list-check"></i> View My Requests</a
                >
                <a href="{% url 'home' %}"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </body>
</html>
