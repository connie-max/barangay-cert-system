<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Login - Barangay Certificate System</title>
    </head>
    <body>
        <h2>Barangay Certificate Request System</h2>
        <h3>Login</h3>

        {% if form.errors %}
        <p style="color: red">Invalid username or password. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username:</label><br />
            <input type="text" name="username" id="id_username" /><br /><br />

            <label for="id_password">Password:</label><br />
            <input type="password" name="password" id="id_password" /><br /><br />

            <button type="submit">Log In</button>
        </form>
    </body>
</html>
