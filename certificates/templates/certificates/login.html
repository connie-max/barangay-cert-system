<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Login - Barangay Certificate System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Poppins', sans-serif;
                background: linear-gradient(135deg, #1e3c72, #2a5298);
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .auth-wrapper {
                background: #ffffff;
                border-radius: 20px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
                width: 100%;
                max-width: 980px;
                display: flex;
                overflow: hidden;
                min-height: 640px;
            }

            .side-panel {
                background: linear-gradient(135deg, #2a5298, #1e3c72);
                color: white;
                flex: 0 0 38%;
                padding: 54px 40px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            .side-panel .logo {
                width: 68px;
                height: 68px;
                border-radius: 16px;
                background: rgba(255, 255, 255, 0.15);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px;
                margin-bottom: 26px;
            }

            .side-panel h2 {
                font-size: 26px;
                font-weight: 700;
                margin-bottom: 14px;
            }

            .side-panel p {
                font-size: 15px;
                opacity: 0.85;
                line-height: 1.6;
                margin-bottom: 30px;
            }

            .side-panel a {
                display: inline-block;
                padding: 13px 34px;
                border: 1.5px solid rgba(255, 255, 255, 0.6);
                border-radius: 9px;
                color: white;
                text-decoration: none;
                font-size: 15px;
                font-weight: 600;
                transition: background 0.2s;
            }

            .side-panel a:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .form-panel {
                flex: 1;
                min-width: 0;
                padding: 54px 48px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .form-panel h1 {
                font-size: 26px;
                font-weight: 700;
                color: #1a1a2e;
                margin-bottom: 6px;
            }

            .form-panel .subtitle {
                font-size: 14px;
                color: #777;
                margin-bottom: 32px;
            }

            .error-message {
                background: #fdecea;
                color: #b71c1c;
                padding: 11px 14px;
                border-radius: 8px;
                font-size: 13px;
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                font-size: 12px;
                color: #444;
                margin-bottom: 6px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }

            .input-wrap {
                position: relative;
            }

            .input-wrap i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: #aaa;
                font-size: 14px;
            }

            /* 16px stops iPhones from zooming into the field when tapped */
            input[type='text'],
            input[type='password'] {
                width: 100%;
                padding: 13px 15px 13px 40px;
                border: 1.5px solid #e5e5e5;
                border-radius: 10px;
                font-size: 16px;
                font-family: 'Poppins', sans-serif;
                transition: border-color 0.2s;
            }

            input[type='text']:focus,
            input[type='password']:focus {
                outline: none;
                border-color: #2a5298;
            }

            button {
                width: 100%;
                min-height: 48px;
                padding: 14px;
                background: linear-gradient(135deg, #2a5298, #1e3c72);
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                font-family: 'Poppins', sans-serif;
                cursor: pointer;
                margin-top: 8px;
                transition: opacity 0.2s;
            }

            button:hover {
                opacity: 0.9;
            }

            /* Tablets and phones: stack the panels, login form FIRST */
            @media (max-width: 900px) {
                .auth-wrapper {
                    flex-direction: column-reverse;
                    min-height: auto;
                }
                .side-panel {
                    flex: none;
                    padding: 28px 24px;
                }
                .side-panel .logo {
                    width: 52px;
                    height: 52px;
                    font-size: 24px;
                    margin-bottom: 14px;
                }
                .side-panel h2 {
                    font-size: 20px;
                    margin-bottom: 8px;
                }
                .side-panel p {
                    font-size: 14px;
                    margin-bottom: 20px;
                }
                .form-panel {
                    padding: 36px 32px;
                }
            }

            /* Small phones */
            @media (max-width: 480px) {
                body {
                    padding: 12px;
                }
                .auth-wrapper {
                    border-radius: 16px;
                }
                .form-panel {
                    padding: 28px 20px;
                }
                .form-panel h1 {
                    font-size: 22px;
                }
                .form-panel .subtitle {
                    margin-bottom: 24px;
                }
                .side-panel p {
                    display: none;
                }
                .side-panel a {
                    width: 100%;
                    text-align: center;
                    padding: 14px;
                }
            }
        </style>
    </head>
    <body>
        <div class="auth-wrapper">
            <div class="side-panel">
                <div class="logo"><i class="fa-solid fa-landmark"></i></div>
                <h2>Barangay Certificate System</h2>
                <p>
                    Request and track barangay certificates online clearance, residency, indigency,
                    and more.
                </p>
                <a href="{% url 'signup' %}">Create Account</a>
            </div>

            <div class="form-panel">
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to continue to your dashboard</p>

                {% if form.errors %}
                <div class="error-message">
                    <i class="fa-solid fa-circle-exclamation"></i> Invalid username or password.
                    Please try again.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_username">Username</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-user"></i>
                            <input
                                type="text"
                                name="username"
                                id="id_username"
                                autocomplete="username"
                                autocapitalize="none"
                                autocorrect="off"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input
                                type="password"
                                name="password"
                                id="id_password"
                                autocomplete="current-password"
                            />
                        </div>
                    </div>

                    <button type="submit">Log In</button>
                </form>
            </div>
        </div>
    </body>
</html>
